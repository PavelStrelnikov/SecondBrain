name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # Скачивание дистрибутива Gradle и зависимостей иногда обрывается на раннере; три попытки.
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon assembleDebug && exit 0
            echo "attempt $i failed, retrying in 20s"; sleep 20
          done
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk secondbrain-capture-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: secondbrain-capture-apk
          path: android/secondbrain-capture-*.apk

      - name: Publish as "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Capture app (сборка ${{ github.run_number }})"
          body: "Debug-сборка приложения-перехватчика. Скачай APK на телефон и установи поверх предыдущей версии."
          prerelease: true
          files: android/secondbrain-capture-*.apk
