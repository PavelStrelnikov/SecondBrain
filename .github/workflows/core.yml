name: core

on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brain -d brain_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://brain:brain@localhost:5432/brain_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://brain:brain@localhost:5432/brain_test
        run: pytest -q
